<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wish It</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Loading ── -->
  <div id="screen-loading" class="screen">
    <div class="spinner"></div>
  </div>

  <!-- ── Login ── -->
  <div id="screen-login" class="screen hidden">
    <div class="brand">
      <img src="icons/48.png" width="40" height="40" alt="" />
      <span class="brand-name">WISH IT</span>
    </div>
    <p class="brand-sub">Log in to start saving wishes</p>

    <button id="btn-google" class="btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <form id="form-login" autocomplete="on">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com"
               autocomplete="email" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••"
               autocomplete="current-password" required />
      </div>
      <p id="login-error" class="error-msg hidden"></p>
      <button id="btn-login" class="btn-primary" type="submit">LOG IN</button>
    </form>
  </div>

  <!-- ── Main (add wish) ── -->
  <div id="screen-main" class="screen hidden">
    <header class="topbar">
      <div class="brand-sm">
        <img src="icons/16.png" width="20" height="20" alt="" />
        <span>WISH IT</span>
      </div>
      <button id="btn-logout" class="btn-ghost" type="button">Log out</button>
    </header>

    <!-- Image preview -->
    <div id="image-wrap" class="image-wrap hidden">
      <img id="product-image" src="" alt="Product" />
    </div>

    <div class="form-body">
      <!-- Title -->
      <div class="field">
        <label for="wish-title">Title</label>
        <input id="wish-title" type="text" placeholder="Product name" />
      </div>

      <!-- Price + Currency -->
      <div class="row">
        <div class="field" style="flex:1">
          <label for="wish-price">Price</label>
          <input id="wish-price" type="number" placeholder="0" min="0" step="0.01" />
        </div>
        <div class="field" style="width:96px">
          <label for="wish-currency">Currency</label>
          <select id="wish-currency">
            <option>USD</option><option>EUR</option><option>GBP</option>
            <option>JPY</option><option>CAD</option><option>AUD</option>
            <option>CHF</option><option>INR</option><option>AED</option>
            <option>SAR</option><option>LBP</option><option>TRY</option>
            <option>KRW</option><option>BRL</option><option>MXN</option>
          </select>
        </div>
      </div>

      <!-- Wishlist -->
      <div class="field">
        <label for="wish-wishlist">Add to wishlist</label>
        <div class="select-wrap">
          <select id="wish-wishlist">
            <option value="">Loading wishlists…</option>
          </select>
        </div>
      </div>

      <p id="main-error" class="error-msg hidden"></p>

      <button id="btn-add" class="btn-primary" type="button" disabled>
        ADD TO WISHLIST
      </button>
    </div>
  </div>

  <!-- ── Success ── -->
  <div id="screen-success" class="screen hidden">
    <div class="success-icon">✓</div>
    <p class="success-title">Added!</p>
    <p id="success-wishlist-name" class="success-sub"></p>
    <button id="btn-add-another" class="btn-secondary" type="button">
      Add another wish
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
